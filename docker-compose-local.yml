name: crimsonred

services:
  mysql:
    image: mysql:8.4.11
    container_name: crimsonred-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crimsonred
      MYSQL_USER: crimsonred
      MYSQL_PASSWORD: crimsonred
      MYSQL_ROOT_PASSWORD: crimsonred
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" --silent'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  redis:
    image: redis:8.2.10
    container_name: crimsonred-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: crimsonred
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: crimsonred-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  mysql-data:
