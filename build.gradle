plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.crimsonred'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    // Security patches until Spring Boot's BOM includes these versions.
    implementation platform('tools.jackson:jackson-bom:3.1.7')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        ['tomcat-embed-core', 'tomcat-embed-el', 'tomcat-embed-websocket'].each {
            implementation "org.apache.tomcat.embed:${it}:11.0.26"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'UTC'
}

tasks.withType(Jar).configureEach {
    exclude '**/application-local.yml', '**/application-local.yaml', '**/application-local.properties', '**/.env*',
            '**/.aws/**', '**/.tools/**', '**/*.pem', '**/*.key', '**/*.p12',
            '**/*.pfx', '**/*.jks', '**/*.keystore', '**/*.log', '**/*.jfr',
            '**/*.hprof', '**/*.dmp', '**/*.bak', '**/*.orig', '**/*.rej'
}
